<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GastoLibre · anota tus gastos en dos toques</title>
  <meta name="theme-color" content="#0a0e12">
  <meta name="description" content="App de gastos sin cuentas y sin bancos: anota en dos toques, funciona sin internet y tus datos se quedan en tu teléfono.">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════ bienvenida ═══════════ -->
  <section id="bienvenida" class="oculto" aria-label="Primeros pasos">
    <div class="marca">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="#3ecf8e" stroke-width="2.5"/>
        <path d="M10 16.5l4.2 4.2L22.5 12" fill="none" stroke="#3ecf8e" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <b>Gasto<i>Libre</i></b>
    </div>
    <p class="paso" id="b-paso">Paso 1 de 3</p>
    <h1 id="b-titulo"></h1>
    <p class="dice" id="b-dice"></p>
    <div id="b-cuerpo"></div>
    <div class="botones">
      <button class="btn fantasma oculto" id="b-atras">Atrás</button>
      <button class="btn principal" id="b-sigue">Continuar</button>
    </div>
  </section>

  <!-- ═══════════ anotar ═══════════ -->
  <section id="p-anotar" class="pantalla" aria-label="Anotar un gasto">
    <button class="queda" id="queda" aria-label="Ver resumen del periodo">
      <span class="txt">
        <span class="k" id="queda-k">Te queda</span>
        <span class="v" id="queda-v">—</span>
        <span class="sub" id="queda-sub"></span>
        <span class="barra"><i id="queda-barra" style="width:0%"></i></span>
      </span>
      <svg class="flecha" width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </button>

    <div class="monto">
      <div class="segmento" role="group" aria-label="Tipo de movimiento">
        <button id="t-gasto" class="on" aria-pressed="true">Gasto</button>
        <button id="t-ingreso" aria-pressed="false">Ingreso</button>
      </div>
      <div class="cifra cero" id="cifra" aria-live="polite">$0</div>
      <div class="pistas">
        <button class="pista" id="p-cuotas">÷ Cuotas</button>
        <button class="pista" id="p-nota">+ Nota</button>
        <button class="pista" id="p-fecha">Hoy</button>
      </div>
    </div>

    <div class="cats" id="cats" aria-label="Categorías"></div>

    <div class="teclado" id="teclado" aria-label="Teclado numérico"></div>
  </section>

  <!-- ═══════════ resumen ═══════════ -->
  <section id="p-resumen" class="pantalla">
    <div class="shell scroll" id="resumen"></div>
  </section>

  <!-- ═══════════ ajustes ═══════════ -->
  <section id="p-ajustes" class="pantalla">
    <div class="shell scroll" id="ajustes"></div>
  </section>

  <!-- ═══════════ navegación ═══════════ -->
  <nav class="nav" aria-label="Secciones">
    <div class="in">
      <button data-p="anotar" class="on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Anotar
      </button>
      <button data-p="resumen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 19V5M4 19h16M8 15v-4M13 15V8M18 15v-2"/>
        </svg>
        Resumen
      </button>
      <button data-p="ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6M18.4 18.4l-1.6-1.6M7.2 7.2L5.6 5.6"/>
        </svg>
        Ajustes
      </button>
    </div>
  </nav>

  <!-- ═══════════ hoja inferior ═══════════ -->
  <div class="velo" id="velo"></div>
  <div class="hoja" id="hoja" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo">
    <div class="asa"></div>
    <h2 id="hoja-titulo"></h2>
    <p class="sub" id="hoja-sub"></p>
    <div id="hoja-cuerpo"></div>
  </div>

  <div class="tosti" id="tosti" role="status" aria-live="polite"></div>
  <input id="importar-archivo" type="file" accept=".json,application/json" hidden>

  <script src="js/dominio.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/interfaz.js"></script>
  <script src="js/vistas/anotar.js"></script>
  <script src="js/vistas/resumen.js"></script>
  <script src="js/vistas/ajustes.js"></script>
  <script src="js/vistas/bienvenida.js"></script>
  <script src="js/exportar.js"></script>
  <script src="js/archivo.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
      // cuando llega una versión nueva de la app, recargar una sola vez
      let yaRecargo = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (yaRecargo || !navigator.serviceWorker.controller) return;
        yaRecargo = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
